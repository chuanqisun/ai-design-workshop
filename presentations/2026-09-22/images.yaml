    reference_url: "https://www.designcouncil.org.uk/our-resources/framework-for-innovation/"
    alt_text: "Diagram of the Double Diamond design process showing Discover, Define, Develop, Deliver phases"
    description: "The classic design framework mapping divergent exploration and convergent synthesis across problem and solution spaces."

  - filename: grounded-theory-glaser-strauss.jpg
    title: "The Discovery of Grounded Theory (Glaser & Strauss, 1967)"
    section: "New Ways to Design / Curate"
    source_url: "https://images.routledge.com/common/jackets/crclarge/978020230/9780202302607.jpg"
    reference_url: "https://www.routledge.com/The-Discovery-of-Grounded-Theory-Strategies-for-Qualitative-Research/Glaser-Strauss/p/book/9780202302607"
    alt_text: "Book cover of The Discovery of Grounded Theory by Barney Glaser and Anselm Strauss"
    description: "Methodological anchor for the Curate phase: evidence-based synthesis, inductive clustering, and systematic theory formulation."

